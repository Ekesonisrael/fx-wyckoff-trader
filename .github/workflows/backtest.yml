name: FX Backtest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run FX backtest
        run: python fx_backtest.py

      - name: Commit results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "fx backtest [skip ci]"
          git pull --rebase origin main || true
          git push || true

      - name: Upload trades CSV
        uses: actions/upload-artifact@v4
        with:
          name: fx-backtest-trades
          path: fx_trades.csv
          retention-days: 30
          if-no-files-found: ignore
